name: apexcharts_flutter_example
description: Gallery app showcasing the apexcharts_flutter chart engine.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  apexcharts_flutter:
    path: ../

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - fixtures/
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Variable.ttf
