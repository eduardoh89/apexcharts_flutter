name: apex_dart_example
description: Gallery app showcasing the apex_dart chart engine.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  apex_dart:
    path: ../

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - fixtures/
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Variable.ttf
