name: apexcharts_flutter
description: >-
  Native Flutter/Dart port of ApexCharts v4.7.0 (last MIT release). A
  CustomPainter-based charting engine with 13 chart types that runs on macOS,
  web, Android, Windows and iOS without any JS/WebView dependency.
version: 0.1.0
homepage: https://github.com/eduardoh89/apexcharts_flutter
repository: https://github.com/eduardoh89/apexcharts_flutter
issue_tracker: https://github.com/eduardoh89/apexcharts_flutter/issues
topics:
  - charts
  - visualization
  - graph
  - custompainter
  - widgets

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
